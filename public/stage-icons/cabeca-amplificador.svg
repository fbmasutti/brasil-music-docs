    <circle cx="140" cy="148" r="32" fill="#022d34"/><circle cx="140" cy="148" r="21" fill="#cfcee5"/>
    <circle cx="234" cy="148" r="32" fill="#022d34"/><circle cx="234" cy="148" r="21" fill="#cfcee5"/>
