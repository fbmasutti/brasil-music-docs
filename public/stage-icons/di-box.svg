<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660">
  <!-- Direct box na paleta ciano-teal do grupo de amplificação.
       É a peça menor do mapa, então só formas grandes: combo XLR à esquerda,
       dois knobs, LEDs e dois jacks P10 à direita. -->

  <!-- Knobs do topo -->
  <g fill="#1a2226">
    <path d="M214 44 h84 l22 132 h-128 z" stroke="#200d02" stroke-width="14" stroke-linejoin="round"/>
    <path d="M458 44 h84 l22 132 h-128 z" stroke="#200d02" stroke-width="14" stroke-linejoin="round"/>
    <path d="M702 44 h84 l22 132 h-128 z" stroke="#200d02" stroke-width="14" stroke-linejoin="round"/>
  </g>

  <!-- Corpo -->
  <rect x="52" y="168" width="896" height="448" rx="48"
        fill="#4a5560" stroke="#200d02" stroke-width="18"/>
  <rect x="86" y="196" width="828" height="60" rx="26" fill="#5f6c78" opacity="0.7"/>

  <!-- Combo XLR de entrada -->
  <circle cx="250" cy="410" r="128" fill="#1a2226"/>
  <circle cx="250" cy="410" r="96" fill="#0e1418"/>
  <g fill="#4a5560">
    <circle cx="250" cy="356" r="24"/>
    <circle cx="206" cy="436" r="24"/>
    <circle cx="294" cy="436" r="24"/>
  </g>

  <!-- Knobs de nível -->
  <g>
    <circle cx="470" cy="352" r="58" fill="#1a2226"/>
    <circle cx="470" cy="352" r="40" fill="#9aa6b1"/>
    <path d="M470 352 L456 320" stroke="#1a2226" stroke-width="12" stroke-linecap="round"/>
    <circle cx="470" cy="486" r="58" fill="#1a2226"/>
    <circle cx="470" cy="486" r="40" fill="#9aa6b1"/>
    <path d="M470 486 L484 456" stroke="#1a2226" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Divisória e LEDs (ground lift / pad) -->
  <rect x="592" y="300" width="14" height="238" rx="7" fill="#eef2f5" opacity="0.85"/>
  <circle cx="672" cy="352" r="30" fill="#0591a8" stroke="#0e1418" stroke-width="10"/>
  <circle cx="672" cy="486" r="30" fill="#f25332" stroke="#0e1418" stroke-width="10"/>

  <!-- Jacks P10 de saída -->
  <g>
    <circle cx="820" cy="352" r="62" fill="#8d99a4"/>
    <circle cx="820" cy="352" r="46" fill="#0e1418"/>
    <circle cx="820" cy="486" r="62" fill="#8d99a4"/>
    <circle cx="820" cy="486" r="46" fill="#0e1418"/>
  </g>
</svg>
