<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510">
  <!-- Cunha de retorno de palco em 3/4, traçada da foto de referência.
       A arte-base aponta para a esquerda; o monitor direito reusa este mesmo
       arquivo espelhado por CSS (flipX no STAGE_KINDS). -->

  <!-- Silhueta do gabinete -->
  <path d="M124 21 L712 8 L940 360 L935 414 L75 495 L10 215 Z"
        fill="#2b3238" stroke="#200d02" stroke-width="16" stroke-linejoin="round"/>

  <!-- Baffle inclinado (a face grande que aponta para o músico) -->
  <path d="M124 21 L712 8 L940 360 L280 398 Z" fill="#3a444d"/>

  <!-- Tela / grade do alto-falante -->
  <path d="M196 66 L688 54 L888 340 L322 372 Z" fill="#161b20"/>
  <path d="M196 66 L688 54 L700 76 L214 88 Z" fill="#20272d"/>

  <!-- Tampa lateral, o lado baixo da cunha -->
  <path d="M124 21 L280 398 L75 495 L10 215 Z" fill="#232a30"/>

  <!-- Alça embutida -->
  <ellipse cx="140" cy="300" rx="52" ry="62" fill="#1b2126"/>
  <ellipse cx="140" cy="300" rx="24" ry="30" fill="#0f1317"/>

  <!-- Faixa frontal inferior -->
  <path d="M280 398 L940 360 L935 414 L75 495 Z" fill="#1e242a"/>

  <!-- Brilho no canto superior, o mesmo recurso das outras caixas do set -->
  <path d="M132 30 L706 17 L700 40 L146 52 Z" fill="#55636e" opacity="0.55"/>
</svg>
