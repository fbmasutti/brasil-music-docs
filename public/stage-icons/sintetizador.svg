<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
  <!-- Sintetizador / controlador MIDI: painel de controle + teclado curto.
       Paleta roxo-acinzentada com acento ciano, para não colidir com o teclado
       (preto/branco) nem com o órgão (vermelho). -->

  <!-- Corpo -->
  <rect x="30" y="60" width="940" height="390" rx="30" fill="#2b1d32"/>
  <rect x="30" y="60" width="940" height="340" rx="30" fill="#4d3a57"/>

  <!-- Painel de controle -->
  <rect x="66" y="92" width="868" height="150" rx="16" fill="#2b1d32"/>

  <!-- Visor -->
  <rect x="92" y="118" width="150" height="98" rx="10" fill="#022d34"/>
  <g fill="#06b6d4">
    <rect x="110" y="140" width="114" height="10" rx="5"/>
    <rect x="110" y="162" width="80" height="10" rx="5"/>
    <rect x="110" y="184" width="98" height="10" rx="5"/>
  </g>

  <!-- Knobs -->
  <g>
    <g fill="#a3add0">
      <circle cx="304" cy="140" r="26"/><circle cx="380" cy="140" r="26"/>
      <circle cx="456" cy="140" r="26"/><circle cx="532" cy="140" r="26"/>
    </g>
    <g stroke="#2b1d32" stroke-width="7" stroke-linecap="round">
      <path d="M304 140 L 292 124"/><path d="M380 140 L 391 123"/>
      <path d="M456 140 L 444 124"/><path d="M532 140 L 543 124"/>
    </g>
  </g>

  <!-- Pads -->
  <g fill="#06b6d4">
    <rect x="286" y="180" width="46" height="40" rx="8"/>
    <rect x="344" y="180" width="46" height="40" rx="8"/>
    <rect x="402" y="180" width="46" height="40" rx="8"/>
    <rect x="460" y="180" width="46" height="40" rx="8"/>
  </g>
  <g fill="#0591a8">
    <rect x="518" y="180" width="46" height="40" rx="8"/>
    <rect x="576" y="180" width="46" height="40" rx="8"/>
  </g>

  <!-- Faders -->
  <g>
    <g fill="#2b1d32" stroke="#a3add0" stroke-width="4">
      <rect x="662" y="118" width="18" height="100" rx="9"/>
      <rect x="722" y="118" width="18" height="100" rx="9"/>
      <rect x="782" y="118" width="18" height="100" rx="9"/>
      <rect x="842" y="118" width="18" height="100" rx="9"/>
    </g>
    <g fill="#cfcee5">
      <rect x="650" y="150" width="42" height="20" rx="7"/>
      <rect x="710" y="182" width="42" height="20" rx="7"/>
      <rect x="770" y="134" width="42" height="20" rx="7"/>
      <rect x="830" y="166" width="42" height="20" rx="7"/>
    </g>
  </g>

  <!-- Roda de pitch/mod -->
  <g>
    <rect x="70" y="268" width="52" height="112" rx="24" fill="#2b1d32"/>
    <rect x="80" y="300" width="32" height="16" rx="8" fill="#06b6d4"/>
    <rect x="140" y="268" width="52" height="112" rx="24" fill="#2b1d32"/>
    <rect x="150" y="330" width="32" height="16" rx="8" fill="#06b6d4"/>
  </g>

  <!-- Teclado -->
  <g>
    <rect x="216" y="268" width="718" height="116" rx="10" fill="#cfcee5"/>
    <g stroke="#a3add0" stroke-width="4">
      <path d="M268 268 L 268 384"/><path d="M320 268 L 320 384"/>
      <path d="M372 268 L 372 384"/><path d="M424 268 L 424 384"/>
      <path d="M476 268 L 476 384"/><path d="M528 268 L 528 384"/>
      <path d="M580 268 L 580 384"/><path d="M632 268 L 632 384"/>
      <path d="M684 268 L 684 384"/><path d="M736 268 L 736 384"/>
      <path d="M788 268 L 788 384"/><path d="M840 268 L 840 384"/>
      <path d="M892 268 L 892 384"/>
    </g>
    <g fill="#2b1d32">
      <rect x="252" y="268" width="32" height="70" rx="5"/>
      <rect x="304" y="268" width="32" height="70" rx="5"/>
      <rect x="408" y="268" width="32" height="70" rx="5"/>
      <rect x="460" y="268" width="32" height="70" rx="5"/>
      <rect x="512" y="268" width="32" height="70" rx="5"/>
      <rect x="616" y="268" width="32" height="70" rx="5"/>
      <rect x="668" y="268" width="32" height="70" rx="5"/>
      <rect x="772" y="268" width="32" height="70" rx="5"/>
      <rect x="824" y="268" width="32" height="70" rx="5"/>
      <rect x="876" y="268" width="32" height="70" rx="5"/>
    </g>
  </g>
</svg>
