<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Trombone de vara: bocal, vara dupla, curva e campana. -->
  <!-- Bocal -->
  <circle cx="96" cy="470" r="42" fill="#121214"/>
  <rect x="96" y="450" width="120" height="40" rx="20" fill="#121214"/>
  <!-- Vara dupla (slide) -->
  <rect x="200" y="404" width="470" height="40" rx="20" fill="#121214"/>
  <rect x="200" y="496" width="470" height="40" rx="20" fill="#121214"/>
  <!-- Curva da vara -->
  <path d="M640 404h30a20 20 0 0 1 20 20v92a20 20 0 0 1-20 20h-30z" fill="#121214"/>
  <!-- Trava / punho -->
  <rect x="300" y="444" width="26" height="52" fill="#121214"/>
  <rect x="272" y="536" width="90" height="30" rx="12" fill="#7C3AED"/>
  <rect x="316" y="496" width="26" height="52" fill="#121214"/>
  <!-- Tudel para a campana -->
  <rect x="670" y="440" width="120" height="60" rx="24" fill="#121214"/>
  <!-- Campana -->
  <path d="M780 470c0-96 60-160 150-160v320c-90 0-150-64-150-160z" fill="#F59E0B"/>
  <ellipse cx="930" cy="470" rx="42" ry="160" fill="#FBBF24"/>
</svg>
